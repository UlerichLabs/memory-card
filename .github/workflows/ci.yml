name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: apps/api/go.sum
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/api
          args: --config ../../.golangci-lint.yml
      - name: Build
        run: go build ./...
      - name: Testes (Sprint futura)
        run: echo 'go test ./... será habilitado quando houver regras de negócio na camada service.'
