name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: apps/api/go.sum
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/api
          args: --config ../../.golangci-lint.yml
      - name: Build
        run: go build ./...
      - name: Testes unitários com cobertura
        run: go test -v -coverprofile=coverage.out ./...
      - name: Verificar meta de cobertura
        run: |
          go tool cover -func=coverage.out
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${TOTAL_COVERAGE}%"
          # Meta definida: 20% no total geral do módulo (inclui código gerado sqlc e cmd/server).
          # Pacotes manuais com regras de negócio e configuração possuem 100% de cobertura.
          THRESHOLD=20.0
          awk -v cov="$TOTAL_COVERAGE" -v th="$THRESHOLD" 'BEGIN {
            if (cov < th) {
              printf "ERRO: Cobertura total (%.1f%%) abaixo da meta mínima de %.1f%%\n", cov, th;
              exit 1;
            }
            printf "SUCESSO: Cobertura total (%.1f%%) atingiu a meta mínima de %.1f%%\n", cov, th;
          }'

  api-e2e:
    name: E2E Tests (Testcontainers)
    needs: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: apps/api/go.sum
      - name: Executar testes E2E com Testcontainers
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: go test -v -tags=e2e ./tests/e2e/...
