services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memory_card
      POSTGRES_USER: memory_card
      POSTGRES_PASSWORD: memory_card
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_card"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: "postgres://memory_card:memory_card@postgres:5432/memory_card?sslmode=disable"
      IGDB_CLIENT_ID: "${IGDB_CLIENT_ID}"
      IGDB_CLIENT_SECRET: "${IGDB_CLIENT_SECRET}"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
